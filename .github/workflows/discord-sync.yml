name: Discord character sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          CHARACTER_FORUM_ID: ${{ secrets.CHARACTER_FORUM_ID }}
          CHARACTER_THREAD_ID: ${{ secrets.CHARACTER_THREAD_ID }}
          API_URL: ${{ secrets.API_URL }}
          EDIT_KEY: ${{ secrets.EDIT_KEY }}
